name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headers:
    name: Attribution headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check template headers
        run: python3 tools/check_headers.py

  tools:
    name: Tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install flake8
        run: python3 -m pip install --user flake8==7.4.1

      - name: flake8
        run: python3 -m flake8 tools/ tests/

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: PHP syntax
        run: php -l tools/render_on_board.php
